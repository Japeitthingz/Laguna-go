 const bad=e=>{b.classList.remove("busy");msg(e.code===1?"Location is blocked. Allow it in your browser settings.":"Couldn't get your location. Try again outdoors or with Wi-Fi on.");};
 navigator.geolocation.getCurrentPosition(ok,e=>e.code===1?bad(e):navigator.geolocation.getCurrentPosition(ok,bad,{enableHighAccuracy:false,timeout:15000,maximumAge:60000}),{enableHighAccuracy:true,timeout:8000,maximumAge:30000});}
// single entry points used by Map, Discover, Saved and Reels
async function showOnMap(id){const p=find(id);if(!p)return;switchTab("map");map.invalidateSize();ring.clearLayers();if(!await ensureCoords(p)){sheet(placeSheet(p));return msg("No exact pin found. Use Open in Maps.");}
 L.circleMarker([p.lat,p.lng],{radius:17,color:"#f5b52e",weight:4,fill:false}).addTo(ring);map.flyTo([p.lat,p.lng],15,{duration:.8});sheet(placeSheet(p));}
function startDirections(id){const p=find(id);if(!p)return;switchTab("map");map.invalidateSize();ring.clearLayers();if(p.lat!=null){L.circleMarker([p.lat,p.lng],{radius:17,color:"#f5b52e",weight:4,fill:false}).addTo(ring);map.flyTo([p.lat,p.lng],14,{duration:.8});}
 sheet(`<h2>Go to ${esc(p.name)}</h2><p class="meta">How are you getting there?</p><div class="row"><button class="pri" data-a="go" data-m="driving" data-id="${id}">🚗 Drive</button><button class="pri" data-a="go" data-m="walking" data-id="${id}">🚶 Walk</button><button class="pri" data-a="go" data-m="commute" data-id="${id}">🚌 Commute</button></div>`);}
function sheet(h){const s=$("#sheet");s.hidden=!h;s.innerHTML=h?`<div class="grab" data-a="close"></div>${h}`:"";s.style.animation="none";s.offsetWidth;s.style.animation="";requestAnimationFrame(sheetH);}
function placeSheet(p){return `${p.photo?`<div class="ph"><img src="${esc(p.photo)}" alt=""></div>`:`<div class="ph">${catOf(p)[0]?.emoji||"📍"}</div>`}<h2>${esc(p.name)} ${demoTag(p.demo)}</h2>
<p class="meta">${esc(p.town)}${p.town?", ":""}Laguna${S.loc?` · <span class="km">${dist(p)}</span>`:""}</p><div class="tags">${catOf(p).map(c=>`<span>${c.emoji} ${c.label}</span>`).join("")}</div><p>${esc(p.desc)}</p>${p.approx?'<p class="meta">Pin found by map search, so it is approximate.</p>':""}${travelHtml(p)}
<div class="row"><button class="pri" data-a="dir" data-id="${p.id}">Get Directions</button><button data-a="save" data-id="${p.id}">${S.saved.has(p.id)?"❤️ Saved":"🤍 Save"}</button><a class="btn" href="${mapsUrl(p)}" target="_blank" rel="noopener">Open in Maps</a></div>`;}
async function go(id,mode){const p=find(id);if(mode==="commute")return commute(p);
 if(!S.loc)return sheet(`<h2>Where are you now?</h2><p class="meta">Turn on location so Laguna Go can start your route.</p><button class="pri" data-a="locate">Use my location</button>`);
 sheet("<p>Finding the best route…</p>");if(!await ensureCoords(p))return sheet(`<h2>Can't place ${esc(p.name)} on the map</h2><p>Open it in your Maps app instead.</p><a class="btn" href="${mapsUrl(p)}" target="_blank" rel="noopener">Open in Maps</a>`);try{const r=await route(mode,S.loc,p);line.clearLayers();const g=L.geoJSON(r.geometry,{style:{color:"#0b5563",weight:6,opacity:.9}}).addTo(line);map.flyToBounds(g.getBounds(),{padding:[60,60],duration:.8});
 sheet(`<h2>${mode==="driving"?"🚗":"🚶"} ${r.min} min <small class="meta">· ${r.km.toFixed(1)} km</small></h2><p class="meta">To ${esc(p.name)}</p><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><button data-a="clear">Clear route</button>`);}
 catch(e){sheet(`<h2>No route</h2><p>${esc(e.message)}. Check your connection or the routing URL in .env.</p>`);}}
async function commute(p,from){const towns=[...new Set(S.places.map(x=>x.town))].sort(),f=from||(S.loc?byNear(S.places)[0].town:towns[0]),g=await repo.commuteGuide(f,p.town);
 const v=(x,u)=>x==null?"not available":x+u,pt=(l,x)=>x?`<p>${l}: ${esc(x.name)}</p>`:"";
 sheet(`<h2>Commute Directions</h2><label class="meta">FROM<select data-a="from" data-id="${p.id}">${towns.map(t=>`<option ${t===f?"selected":""}>${esc(t)}</option>`).join("")}</select></label><p><b>TO</b> ${esc(p.name)}, ${esc(p.town)}</p>
 ${g?`${g.demo?'<p class="warn">DEMO DATA: placeholder steps, not a real route.</p>':""}<p class="meta">${g.verified?"Verified data":"Unverified"} · Total time: ${v(g.totalMinutes," min")} · Total fare: ${v(g.totalFare,"")}</p>
 <ol class="tl">${g.segments.map((s,i,a)=>{const m=MODES[s.mode]||MODES.unknown,tr=s.mode!=="walk"&&a.slice(0,i).some(x=>x.mode!=="walk");
  return `<li class="${s.mode}">${tr?'<p class="tr">Transfer</p>':""}<b>${m.icon} ${m.label}</b><p>${esc(s.note||"")}</p>${pt("Pickup",s.from)}${pt("Drop-off",s.to)}${s.landmark?`<p>Landmark: ${esc(s.landmark)}</p>`:""}<p class="meta">Time: ${v(s.minutes," min")} · Fare: ${v(s.fare,"")}</p></li>`}).join("")}</ol>`
 :`<p class="empty">No verified commute data for ${esc(f)} → ${esc(p.town)} yet. Add it in <code>src/data/transport.js</code> or your database.</p>`}
 <div class="row"><button data-a="go" data-m="driving" data-id="${p.id}">🚗 Drive instead</button><button data-a="go" data-m="walking" data-id="${p.id}">🚶 Walk instead</button></div>`);}
// ---- search
const sugg=$("#sugg");
$("#search input").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();if(!q){sugg.hidden=true;return;}
 const l=S.places.filter(p=>(p.name+" "+p.town).toLowerCase().includes(q)).slice(0,5);
 sugg.innerHTML=l.map(p=>`<li><button data-a="map" data-id="${p.id}">${esc(p.name)}<small>${esc(p.town)}</small></button></li>`).join("")+`<li><button data-a="web" data-q="${esc(e.target.value.trim())}">🔎 Search all of Laguna for “${esc(e.target.value.trim())}”</button></li>`;sugg.hidden=false;});
async function webSearch(q){sugg.hidden=true;if(!q)return;msg("Searching…");try{S.ext=await geocode(q);}catch{return msg("Search service unreachable. Check your connection.");}
 if(!S.ext.length)return msg("Nothing found in Laguna. Try another spelling.");$("#msg").hidden=true;drawPins(S.ext);map.flyToBounds(S.ext.map(p=>[p.lat,p.lng]),{padding:[60,60],maxZoom:15});
 sheet(`<h2>Results</h2>${S.ext.map(p=>`<button class="res" style="width:100%;text-align:left;margin:4px 0" data-a="map" data-id="${p.id}">${esc(p.name)}<small class="meta"> ${esc(p.town)}</small></button>`).join("")}<button data-a="clear">Back to Laguna places</button>`);}
$("#search").onsubmit=e=>{e.preventDefault();webSearch(new FormData(e.target).get("q").trim());};
// ---- views
function card(p){return `<article class="card"><div class="ph">${p.photo?`<img loading="lazy" src="${esc(p.photo)}" alt="">`:catOf(p)[0]?.emoji||"📍"}</div><div class="cb"><h3>${esc(p.name)}</h3>
<p class="meta">${esc(p.town)}${catOf(p).map(c=>" · "+c.label).join("")} ${S.loc?`<span class="km">${dist(p)}</span>`:""} ${demoTag(p.demo)}</p><p>${esc(p.desc)}</p>
<div class="row"><button data-a="map" data-id="${p.id}">View on Map</button><button class="pri" data-a="dir" data-id="${p.id}">Get Directions</button><button style="flex:0" data-a="save" data-id="${p.id}" aria-label="Save">${S.saved.has(p.id)?"❤️":"🤍"}</button></div></div></article>`;}
const sec=(t,a)=>a.length?`<h2>${t}</h2><div class="grid">${a.map(card).join("")}</div>`:"";
function discover(){$("#v-discover").innerHTML=`<header><h1>Tuklasin ang Laguna</h1><p>Places to explore ${demoTag(DEMO)}</p><input id="dq" value="${esc(S.q)}" placeholder="Search places, towns" aria-label="Search places"></header>
 <div class="chips" id="chips"></div><div id="dbody"></div>`;$("#dq").oninput=e=>{S.q=e.target.value;dbody();};dbody();}
function dbody(){$("#chips").innerHTML=`<button class="${S.cat==="all"?"on":""}" data-a="cat" data-id="all">All</button>`+S.cats.map(c=>`<button class="${S.cat===c.id?"on":""}" data-a="cat" data-id="${c.id}">${c.emoji} ${c.label}</button>`).join("");
 const q=S.q.toLowerCase(),l=S.places.filter(p=>(S.cat==="all"||p.cats.includes(S.cat))&&(!q||(p.name+p.town+p.desc).toLowerCase().includes(q))),plain=S.cat!=="all"||q;
 $("#dbody").innerHTML=plain?(l.length?sec(S.loc?"Closest first":"Results",byNear(l)):`<p class="empty">No verified places here yet. Real listings will appear as they're added.</p>`)
 :(S.loc?"":`<div class="banner"><span>Turn on location to see what's near you.</span><button class="pri" data-a="locate">Use location</button></div>`)+sec("Featured",l.filter(p=>p.featured))+(S.loc?sec("Near You",byNear(l).slice(0,4)):"")+sec(S.loc?"Popular Near You":"Popular",byNear(l).sort((a,b)=>b.popularity-a.popularity).slice(0,4));}
const io=new IntersectionObserver(es=>es.forEach(e=>{const on=e.isIntersecting&&e.intersectionRatio>=.6,v=e.target.querySelector("video");e.target.classList.toggle("playing",on);if(v)on?v.play().catch(()=>{}):v.pause();}),{root:$("#v-reels"),threshold:[0,.6]});
function reels(){const r=S.reels.length?(S.loc?[...S.reels].sort((a,b)=>km(S.loc,find(a.placeId))-km(S.loc,find(b.placeId))):S.reels):[];
 $("#v-reels").innerHTML=r.length?r.map(r=>{const p=find(r.placeId);return `<article class="reel"><div class="stage" data-a="tap">${r.videoUrl?`<video src="${esc(r.videoUrl)}" ${r.poster?`poster="${esc(r.poster)}"`:""} loop muted playsinline></video>`:`<div class="pauseico">⏸</div>`}</div>
 ${r.videoUrl?"":`<div class="bar"><i></i></div><span class="demo pill">DEMO VIDEO · placeholder</span>`}<div class="ov"><h3>${esc(r.title)}</h3><p class="meta">${esc(r.creator)}</p><p>${esc(r.desc)}</p>
 <button class="loc" data-a="map" data-id="${r.placeId}">📍 ${esc(p?.name)}, ${esc(p?.town)}${S.loc&&p?" · "+dist(p):""}</button>
 <div class="row"><button data-a="like" data-id="${r.id}">${S.likes.has(r.id)?"♥ Liked":"♡ Like"}</button><button data-a="save" data-id="${r.placeId}">${S.saved.has(r.placeId)?"❤️ Saved":"🤍 Save"}</button><button data-a="share" data-id="${r.id}">Share</button></div>
 <div class="row"><button data-a="map" data-id="${r.placeId}">View Location</button><button class="pri" data-a="dir" data-id="${r.placeId}">Get Directions</button></div></div></article>`}).join(""):`<p class="empty" style="color:#fff">No reels yet.</p>`;
 document.querySelectorAll(".reel").forEach(el=>io.observe(el));}
function saved(){const l=S.places.filter(p=>S.saved.has(p.id));$("#v-saved").innerHTML=`<header><h1>Saved</h1><p>Your places</p></header>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:'<p class="empty">Tap 🤍 on any place to keep it here.</p>'}`;}
function profile(){$("#v-profile").innerHTML=`<header><h1>Profile</h1><p>Guest on this device</p></header><div class="pad"><p>Location: ${S.loc?"on. It stays on this device and is never shared with other users.":"off."}</p><button data-a="locate">Use my location</button><p class="meta">${DEMO?"Demo data is on (VITE_USE_DEMO_DATA).":"Demo data is off."} Accounts and cross-device sync need a backend.</p></div>`;}
function renderAll(){drawPins(S.places);discover();reels();saved();profile();}
function switchTab(t){TABS.forEach(([id])=>$("#v-"+id).hidden=id!==t);document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(t!=="map")sheet("");else map.invalidateSize();}
// ---- events
document.addEventListener("click",async e=>{if(!e.target.closest("#top"))sugg.hidden=true;const b=e.target.closest("[data-t],[data-a]");if(!b)return;const{t,a,id,m,q}=b.dataset;
 if(t)return switchTab(t);
 if(a==="close")sheet("");if(a==="clear"){line.clearLayers();ring.clearLayers();drawPins(S.places);sheet("");}
 if(a==="cat"){S.cat=id;dbody();}if(a==="map")showOnMap(id);if(a==="dir")startDirections(id);if(a==="go")go(id,m);if(a==="locate"){switchTab("map");locate();}if(a==="web")webSearch(q);
 if(a==="save"){S.saved=await repo.toggleSaved(id);discover();saved();reels();if(!$("#sheet").hidden&&find(id))sheet(placeSheet(find(id)));}
 if(a==="like"){S.likes.has(id)?S.likes.delete(id):S.likes.add(id);localStorage.setItem("lagunago.likes",JSON.stringify([...S.likes]));const y=$("#v-reels").scrollTop;reels();$("#v-reels").scrollTop=y;}
 if(a==="tap"){const r=b.closest(".reel"),v=r.querySelector("video");v?(v.paused?v.play():v.pause()):r.classList.toggle("paused");}
 if(a==="share"){const r=S.reels.find(r=>r.id===id),d={title:r.title,url:location.href};navigator.share?navigator.share(d).catch(()=>{}):navigator.clipboard?.writeText(d.url).then(()=>msg("Link copied"));}});
document.addEventListener("change",e=>{const s=e.target;if(s.dataset.a==="from")commute(find(s.dataset.id),s.value);});
$("#locate").onclick=locate;$("#home").onclick=()=>{ring.clearLayers();map.flyToBounds(LAGUNA,{duration:.8});};
$("#nav").innerHTML=TABS.map(([id,i,l])=>`<button data-t="${id}"><span>${i}</span>${l}</button>`).join("");
(async()=>{[S.cats,S.places,S.reels,S.saved]=await Promise.all([repo.categories(),repo.places(),repo.reels(),repo.saved()]);renderAll();switchTab("map");})();

return {};})();
window.__lg=1;
</script></body></html>
